services:
  lainify:
    # Builds locally by default; set LAINIFY_IMAGE=ghcr.io/<owner>/lainify:latest
    # and run `docker compose pull` to use the image published by CI instead.
    image: ${LAINIFY_IMAGE:-lainify:local}
    build: .
    ports:
      # Browsers only allow camera access on https:// or localhost, so the app is
      # bound to loopback. To use it from other machines, put it behind an HTTPS proxy.
      - '127.0.0.1:${LAINIFY_PORT:-8080}:8080'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
